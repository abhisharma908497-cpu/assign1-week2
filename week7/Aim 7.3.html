<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 20px;
}
.banner {
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    flex: 1 1 200px;
    padding: 20px;
    border: 1px solid gray;
    border-radius: 10px;
}
</style>
<body>
    <header class="navbar">
    <h2 class="logo">LearnFlex</h2>

    <nav class="nav-links">
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <button type="button">Join Us</button>
    </nav>
</header>
<section class="banner" id="home">
    <h1>Learn Something New</h1>
    <p>Build your skills one step at a time.</p>
</section>

<section class="cards" id="courses">
    <article class="card">
        <h2>HTML</h2>
        <p>Learn web page structure.</p>
    </article>

    <article class="card">
        <h2>CSS</h2>
        <p>Learn to style web pages.</p>
    </article>

    <article class="card">
        <h2>JavaScript</h2>
        <p>Learn web page interactivity.</p>
    </article>
</section>

</body>
</html>
